name: Thirdwave
description: 'Thirdwave (Third Wave Automation) builds autonomous material-handling
  systems for warehouses and distribution centers, led by its shared-autonomy forklift
  platform where one human operator can supervise a fleet of self-driving forklifts
  that operate independently and hand control back to a person when needed. Its ArmadaFMS
  (Armada Fleet Management System) software coordinates the robotic fleet across facilities.
  The company is a venture-backed logistics-robotics provider (backed by Homebrew and
  Norwest Venture Partners). As of this enrichment pass Third Wave publishes no public
  developer API, SDK, developer portal, or machine-readable API surface; this profile
  captures its identity and public web properties.'
